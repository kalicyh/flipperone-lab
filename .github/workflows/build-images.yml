name: Build Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-dev:
    name: Build flipperone-dev
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Image names
        id: image
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${REGISTRY}/${owner_lc}/flipperone-dev" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push flipperone-dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.dev
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  build-rootfs:
    name: Build flipperone-rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Image names
        id: image
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "rootfs=${REGISTRY}/${owner_lc}/flipperone-rootfs" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs builder
        run: |
          docker build \
            --platform linux/arm64 \
            --file Containerfile.rootfs-builder \
            --tag flipperone-rootfs-builder:ci \
            .

      - name: Build rootfs artifact
        run: |
          mkdir -p artifacts
          docker run \
            --rm \
            --privileged \
            --volume "${PWD}/artifacts:/artifacts" \
            --entrypoint /bin/bash \
            flipperone-rootfs-builder:ci \
            -lc 'cd /rk3576-linux-build && IMG_OUT=/artifacts ./build-ospack.sh'
          test -s artifacts/debian-ospack.tar.gz
          ls -lh artifacts/debian-ospack.tar.gz

      - name: Build and push flipperone-rootfs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.rootfs
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.rootfs }}:latest
            ${{ steps.image.outputs.rootfs }}:${{ github.sha }}
