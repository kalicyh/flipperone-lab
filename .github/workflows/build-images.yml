name: Build Images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-dev:
    name: Build flipperone-dev
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Upstream SHAs
        id: upstream
        run: |
          echo "testing=$(git -C upstream/flipperone-testing rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "build_scripts=$(git -C upstream/flipperone-linux-build-scripts rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Image names
        id: image
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          image="${REGISTRY}/${owner_lc}/flipperone-dev"
          {
            echo "name=${image}"
            echo "tags<<EOF"
            echo "${image}:${GITHUB_SHA}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
            elif [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push flipperone-dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.dev
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            FLIPPERONE_TESTING_SHA=${{ steps.upstream.outputs.testing }}
            FLIPPERONE_BUILD_SCRIPTS_SHA=${{ steps.upstream.outputs.build_scripts }}

  build-rootfs:
    name: Build flipperone-rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Upstream SHAs
        id: upstream
        run: |
          echo "testing=$(git -C upstream/flipperone-testing rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "build_scripts=$(git -C upstream/flipperone-linux-build-scripts rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Image names
        id: image
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          image="${REGISTRY}/${owner_lc}/flipperone-rootfs"
          {
            echo "rootfs=${image}"
            echo "tags<<EOF"
            echo "${image}:${GITHUB_SHA}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${image}:${GITHUB_REF_NAME}"
              echo "${image}:latest"
            elif [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs builder
        run: |
          docker build \
            --platform linux/arm64 \
            --file Containerfile.rootfs-builder \
            --tag flipperone-rootfs-builder:ci \
            .

      - name: Build rootfs artifact
        run: |
          mkdir -p artifacts
          docker run \
            --rm \
            --privileged \
            --volume "${PWD}/artifacts:/artifacts" \
            --entrypoint /bin/bash \
            flipperone-rootfs-builder:ci \
            -lc 'cd /rk3576-linux-build && IMG_OUT=/artifacts ./build-ospack.sh'
          test -s artifacts/debian-ospack.tar.gz
          ls -lh artifacts/debian-ospack.tar.gz

      - name: Prepare rootfs image context
        run: |
          rm -rf .build/rootfs-image-context
          mkdir -p .build/rootfs-image-context/artifacts .build/rootfs-image-context/context/common .build/rootfs-image-context/assets
          cp Containerfile.rootfs .build/rootfs-image-context/Dockerfile
          cp artifacts/debian-ospack.tar.gz .build/rootfs-image-context/artifacts/debian-ospack.tar.gz
          cp context/common/flipper-ui-entrypoint.sh .build/rootfs-image-context/context/common/flipper-ui-entrypoint.sh
          cp -R context/common/lab-overlay .build/rootfs-image-context/context/common/lab-overlay
          cp -R assets/flipperone-protopie .build/rootfs-image-context/assets/flipperone-protopie

      - name: Build and push flipperone-rootfs
        uses: docker/build-push-action@v6
        with:
          context: .build/rootfs-image-context
          file: .build/rootfs-image-context/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            FLIPPERONE_TESTING_SHA=${{ steps.upstream.outputs.testing }}
            FLIPPERONE_BUILD_SCRIPTS_SHA=${{ steps.upstream.outputs.build_scripts }}
