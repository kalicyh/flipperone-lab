<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipper One Lab</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: var(--shell-background, #000);
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
        }

        #shell {
            position: relative;
            width: 100vw;
            height: auto;
        }

        #screen-frame {
            position: absolute;
            left: var(--screen-left, 33.7147%);
            top: var(--screen-top, 24.2123%);
            width: var(--screen-frame-width, 34.0198%);
            height: var(--screen-frame-height, 41.5423%);
            border: 0;
            background: #000;
            z-index: 1;
        }

        #shell-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            user-select: none;
            pointer-events: none;
            z-index: 2;
        }

        #state-overlays {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
        }

        .state-overlay {
            position: absolute;
            object-fit: fill;
            user-select: none;
            pointer-events: none;
        }

        .state-overlay[data-layer="screen"] {
            z-index: 1;
        }

        .state-overlay[data-layer="device"] {
            z-index: 2;
        }

        .key-hotspot {
            position: absolute;
            z-index: 4;
            display: block;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: transparent;
            appearance: none;
            cursor: pointer;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key-hotspot:focus-visible {
            outline: 2px solid rgba(255, 145, 60, 0.85);
            outline-offset: 2px;
        }

        html[data-hotspot-debug="1"] .key-hotspot {
            border: 2px solid rgba(255, 145, 60, 0.85);
            background: rgba(255, 145, 60, 0.18);
            color: #fff;
            font: 12px/1.2 system-ui, sans-serif;
            text-shadow: 0 1px 2px #000;
        }

        html[data-hotspot-debug="1"] .key-hotspot[data-pressed="1"] {
            background: rgba(255, 145, 60, 0.38);
        }
    </style>
</head>
<body>
    <main id="shell" aria-label="Flipper One">
        <iframe id="screen-frame" title="Flipper One UI" src="/__flipper_ui.html"></iframe>
        <img id="shell-overlay" alt="" src="/lab-assets/protopie/flipperone-shell-overlay.png">
        <div id="state-overlays" aria-hidden="true"></div>
    </main>

    <script src="/lab-overlay/lab-browser-runtime.js"></script>
    <script>
        (function() {
            'use strict';

            var defaults = {
                enabled: true,
                title: 'Flipper One Lab',
                uiFrame: '/__flipper_ui.html',
                overlayImage: '/lab-assets/protopie/flipperone-shell-overlay.png',
                overlaySize: { width: 2622, height: 1206 },
                screen: { x: 884, y: 292, width: 892, height: 501 },
                stateOverlays: [],
                fit: { viewportScale: 0.98, maxWidth: '100vw', maxHeight: '100vh' },
                background: '#000000'
            };
            var heldKeys = {};
            var currentConfig = null;
            var stateStorageKey = 'flipperone.lab.stateOverlays.v1';

            function mergeConfig(config) {
                config = config || {};
                return {
                    enabled: config.enabled !== false,
                    title: config.title || defaults.title,
                    uiFrame: config.uiFrame || defaults.uiFrame,
                    overlayImage: config.overlayImage || defaults.overlayImage,
                    overlaySize: Object.assign({}, defaults.overlaySize, config.overlaySize || {}),
                    screen: Object.assign({}, defaults.screen, config.screen || {}),
                    stateOverlays: Array.isArray(config.stateOverlays) ? config.stateOverlays : defaults.stateOverlays,
                    fit: Object.assign({}, defaults.fit, config.fit || {}),
                    background: config.background || defaults.background
                };
            }

            function setVar(name, value) {
                document.documentElement.style.setProperty(name, String(value));
            }

            function resolveLength(value, axis) {
                if (typeof value === 'number') return value;
                var text = String(value || '').trim();
                var number = parseFloat(text);
                if (!Number.isFinite(number)) return axis === 'height' ? window.innerHeight : window.innerWidth;
                if (text.endsWith('vw')) return window.innerWidth * number / 100;
                if (text.endsWith('vh')) return window.innerHeight * number / 100;
                if (text.endsWith('px')) return number;
                return number;
            }

            function layoutShell(config) {
                var shell = document.getElementById('shell');
                var shellWidth = Number(config.overlaySize.width) || defaults.overlaySize.width;
                var shellHeight = Number(config.overlaySize.height) || defaults.overlaySize.height;
                var scale = Number(config.fit.viewportScale) || defaults.fit.viewportScale;
                var maxWidth = resolveLength(config.fit.maxWidth, 'width') * scale;
                var maxHeight = resolveLength(config.fit.maxHeight, 'height') * scale;
                var aspect = shellWidth / shellHeight;
                var width = Math.min(maxWidth, maxHeight * aspect);
                var height = width / aspect;

                shell.style.width = width + 'px';
                shell.style.height = height + 'px';
            }

            function focusFrame() {
                var frame = document.getElementById('screen-frame');
                try {
                    frame.focus();
                    if (frame.contentWindow) frame.contentWindow.focus();
                } catch (e) {}
            }

            function focusFrameFromShellClick(event) {
                var target = event && event.target;
                if (target && target.closest
                    && target.closest('#flab-api-panel, #flab-api-toggle')) {
                    return;
                }
                focusFrame();
            }

            function sendFrameKey(key, type) {
                var frame = document.getElementById('screen-frame');
                if (!key || !frame || !frame.contentWindow) return;

                try {
                    var event = new frame.contentWindow.KeyboardEvent(type, {
                        key: key,
                        bubbles: true,
                        cancelable: true
                    });
                    frame.contentWindow.document.dispatchEvent(event);
                } catch (e) {}
            }

            function releaseHeldKeys() {
                Object.keys(heldKeys).forEach(function(key) {
                    sendFrameKey(key, 'keyup');
                    heldKeys[key] = false;
                });
            }

            function clearHotspots() {
                Array.prototype.forEach.call(document.querySelectorAll('.key-hotspot'), function(node) {
                    node.remove();
                });
            }

            function applyKeyMap(rawKeyMap, shellConfig) {
                clearHotspots();

                var keyMap = rawKeyMap || {};
                if (keyMap.enabled === false || !Array.isArray(keyMap.buttons)) {
                    document.documentElement.dataset.hotspotDebug = '0';
                    return;
                }

                var shell = document.getElementById('shell');
                var mapSize = Object.assign({}, shellConfig.overlaySize || defaults.overlaySize, keyMap.overlaySize || {});
                var shellWidth = Number(mapSize.width) || defaults.overlaySize.width;
                var shellHeight = Number(mapSize.height) || defaults.overlaySize.height;

                document.documentElement.dataset.hotspotDebug = keyMap.debugHitAreas ? '1' : '0';

                keyMap.buttons.forEach(function(button) {
                    if (!button || !button.browserKey || !button.hitArea) return;

                    var area = button.hitArea;
                    var hotspot = document.createElement('button');
                    hotspot.type = 'button';
                    hotspot.className = 'key-hotspot';
                    hotspot.title = button.label || button.id || button.browserKey;
                    hotspot.setAttribute('aria-label', hotspot.title);
                    hotspot.textContent = button.label || button.id || '';
                    hotspot.style.left = ((Number(area.x) || 0) / shellWidth * 100) + '%';
                    hotspot.style.top = ((Number(area.y) || 0) / shellHeight * 100) + '%';
                    hotspot.style.width = ((Number(area.width) || 0) / shellWidth * 100) + '%';
                    hotspot.style.height = ((Number(area.height) || 0) / shellHeight * 100) + '%';

                    function press(event) {
                        event.preventDefault();
                        if (heldKeys[button.browserKey]) return;
                        try {
                            if (event.pointerId !== undefined) hotspot.setPointerCapture(event.pointerId);
                        } catch (e) {}
                        heldKeys[button.browserKey] = true;
                        hotspot.dataset.pressed = '1';
                        focusFrame();
                        sendFrameKey(button.browserKey, 'keydown');
                    }

                    function release(event) {
                        if (event) event.preventDefault();
                        if (!heldKeys[button.browserKey]) return;
                        heldKeys[button.browserKey] = false;
                        hotspot.dataset.pressed = '0';
                        sendFrameKey(button.browserKey, 'keyup');
                        focusFrame();
                    }

                    hotspot.addEventListener('pointerdown', press);
                    hotspot.addEventListener('pointerup', release);
                    hotspot.addEventListener('pointercancel', release);
                    hotspot.addEventListener('lostpointercapture', release);
                    shell.appendChild(hotspot);
                });
            }

            function loadStateOverlayPrefs() {
                try {
                    var prefs = JSON.parse(localStorage.getItem(stateStorageKey) || '{}');
                    return prefs && typeof prefs === 'object' && !Array.isArray(prefs) ? prefs : {};
                } catch (error) {
                    return {};
                }
            }

            function isStateOverlayEnabled(overlay, prefs) {
                if (!overlay || !overlay.id) return false;
                if (Object.prototype.hasOwnProperty.call(prefs, overlay.id)) {
                    return prefs[overlay.id] !== false;
                }
                return overlay.enabled !== false;
            }

            function clearStateOverlays() {
                var container = document.getElementById('state-overlays');
                if (container) container.textContent = '';
            }

            function applyStateOverlays(config) {
                var container = document.getElementById('state-overlays');
                if (!container) return;
                container.textContent = '';

                var overlays = Array.isArray(config.stateOverlays) ? config.stateOverlays : [];
                var prefs = loadStateOverlayPrefs();
                var defaultSize = config.overlaySize || defaults.overlaySize;

                overlays.forEach(function(overlay) {
                    if (!overlay || !overlay.image || !isStateOverlayEnabled(overlay, prefs)) return;

                    var baseSize = Object.assign({}, defaultSize, overlay.baseSize || {});
                    var baseWidth = Number(baseSize.width) || defaults.overlaySize.width;
                    var baseHeight = Number(baseSize.height) || defaults.overlaySize.height;
                    var rect = overlay.rect || { x: 0, y: 0, width: baseWidth, height: baseHeight };
                    var image = document.createElement('img');

                    image.className = 'state-overlay';
                    image.alt = '';
                    image.src = overlay.image;
                    image.dataset.stateId = overlay.id;
                    image.dataset.layer = overlay.layer || 'device';
                    image.style.left = ((Number(rect.x) || 0) / baseWidth * 100) + '%';
                    image.style.top = ((Number(rect.y) || 0) / baseHeight * 100) + '%';
                    image.style.width = ((Number(rect.width) || baseWidth) / baseWidth * 100) + '%';
                    image.style.height = ((Number(rect.height) || baseHeight) / baseHeight * 100) + '%';
                    container.appendChild(image);
                });
            }

            function applyConfig(rawConfig) {
                var config = mergeConfig(rawConfig);
                currentConfig = config;
                if (!config.enabled) {
                    window.location.replace(config.uiFrame);
                    return;
                }

                var shellWidth = Number(config.overlaySize.width) || defaults.overlaySize.width;
                var shellHeight = Number(config.overlaySize.height) || defaults.overlaySize.height;
                var screen = config.screen;
                var fit = config.fit;

                document.title = config.title;
                setVar('--screen-left', ((Number(screen.x) || defaults.screen.x) / shellWidth * 100) + '%');
                setVar('--screen-top', ((Number(screen.y) || defaults.screen.y) / shellHeight * 100) + '%');
                setVar('--screen-frame-width', ((Number(screen.width) || defaults.screen.width) / shellWidth * 100) + '%');
                setVar('--screen-frame-height', ((Number(screen.height) || defaults.screen.height) / shellHeight * 100) + '%');
                setVar('--shell-background', config.background);

                var frame = document.getElementById('screen-frame');
                var overlay = document.getElementById('shell-overlay');
                frame.src = config.uiFrame;
                overlay.src = config.overlayImage;
                layoutShell(config);
                applyStateOverlays(config);
                window.addEventListener('resize', function() { layoutShell(config); });
                frame.addEventListener('load', focusFrame);
                window.addEventListener('click', focusFrameFromShellClick);
                focusFrame();

                fetch('/lab-overlay/key-map.json?cache=' + Date.now(), { cache: 'no-store' })
                    .then(function(response) {
                        if (!response.ok) throw new Error('key-map.json: ' + response.status);
                        return response.json();
                    })
                    .then(function(keyMap) { applyKeyMap(keyMap, config); })
                    .catch(function() { applyKeyMap(null, config); });
            }

            window.addEventListener('blur', releaseHeldKeys);
            window.addEventListener('pagehide', releaseHeldKeys);
            window.addEventListener('storage', function(event) {
                if (event.key === stateStorageKey && currentConfig) applyStateOverlays(currentConfig);
            });
            document.addEventListener('flipper-lab-state-overlays-changed', function() {
                if (currentConfig) applyStateOverlays(currentConfig);
            });

            fetch('/lab-overlay/device-shell.json?cache=' + Date.now(), { cache: 'no-store' })
                .then(function(response) {
                    if (!response.ok) throw new Error('device-shell.json: ' + response.status);
                    return response.json();
                })
                .then(applyConfig)
                .catch(function() {
                    applyConfig(defaults);
                });
        }());
    </script>
</body>
</html>
